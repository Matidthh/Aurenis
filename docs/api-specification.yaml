openapi: 3.0.3
info:
  title: Aurenis API
  description: |
    API RESTful para el sistema de gestión educativa Aurenis.
    Documentación completa para integración frontend.
  version: 1.0.0
  contact:
    name: Aurenis Development Team
    email: dev@aurenis.com

servers:
  - url: http://localhost:3000/api
    description: Servidor de desarrollo
  - url: https://aurenis.com/api
    description: Servidor de producción

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aurenis_session
      description: Autenticación mediante cookie de sesión JWT

  schemas:
    # Modelos de Error
    Error:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error
        code:
          type: string
          description: Código de error específico
        details:
          type: object
          description: Detalles adicionales del error

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: object
              properties:
                issues:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      message:
                        type: string
                      code:
                        type: string

    # Modelos de Autenticación
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
        password:
          type: string
          minLength: 6
          description: Contraseña del usuario

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        redirectUrl:
          type: string
          description: URL de redirección post-login
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
            isSystemAdmin:
              type: boolean
            activeSchool:
              type: object
              properties:
                id:
                  type: string
                slug:
                  type: string
                name:
                  type: string
            multipleSchools:
              type: boolean
              description: Indica si el usuario tiene múltiples colegios

    UserSession:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        isSystemAdmin:
          type: boolean
        activeSchoolId:
          type: string
        activeSchoolSlug:
          type: string
        activeMembershipId:
          type: string
        roleName:
          type: string
        permissions:
          type: array
          items:
            type: string

    SelectSchoolRequest:
      type: object
      required:
        - schoolId
      properties:
        schoolId:
          type: string
          description: ID del colegio seleccionado

    SelectSchoolResponse:
      type: object
      properties:
        success:
          type: boolean
        redirectUrl:
          type: string
        school:
          type: object
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string

    # Modelos de Sistema
    School:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        institutionalCode:
          type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, TRIAL, SUSPENDED]
        settings:
          type: object
        _count:
          type: object
          properties:
            memberships:
              type: integer
            courses:
              type: integer

    CreateSchoolRequest:
      type: object
      required:
        - name
        - slug
        - adminEmail
        - adminFirstName
        - adminLastName
        - adminPassword
      properties:
        name:
          type: string
          description: Nombre del colegio
        slug:
          type: string
          description: Slug URL único del colegio
        institutionalCode:
          type: string
          description: Código institucional único
        city:
          type: string
        country:
          type: string
          default: Chile
        timezone:
          type: string
          default: America/Santiago
        termType:
          type: string
          enum: [SEMESTER, TRIMESTER, BIMESTER, ANNUAL]
          default: SEMESTER
        adminEmail:
          type: string
          format: email
          description: Email del administrador del colegio
        adminFirstName:
          type: string
          description: Nombre del administrador
        adminLastName:
          type: string
          description: Apellido del administrador
        adminPassword:
          type: string
          minLength: 6
          description: Contraseña del administrador
        adminRut:
          type: string
          description: RUT del administrador (opcional)

    CreateSchoolResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        school:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
        admin:
          type: object
          properties:
            id:
              type: string
            email:
              type: string

    # Modelos Académicos
    Course:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        educationLevelId:
          type: string
        name:
          type: string
        letter:
          type: string
        gradeNumber:
          type: integer
        year:
          type: integer
        educationLevel:
          type: object
        _count:
          type: object
          properties:
            enrollments:
              type: integer

    CreateCourseRequest:
      type: object
      required:
        - educationLevelId
        - name
        - gradeNumber
      properties:
        educationLevelId:
          type: string
        name:
          type: string
        letter:
          type: string
        gradeNumber:
          type: integer
        year:
          type: integer

    Grade:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        assessmentId:
          type: string
        enrollmentId:
          type: string
        value:
          type: number
          format: decimal
        feedback:
          type: string
        assessment:
          type: object
        enrollment:
          type: object

    CreateGradeRequest:
      type: object
      required:
        - assessmentId
        - enrollmentId
        - value
      properties:
        assessmentId:
          type: string
        enrollmentId:
          type: string
        value:
          type: number
          format: decimal
        feedback:
          type: string

    # Modelos de Configuración
    SchoolSettings:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        termType:
          type: string
          enum: [SEMESTER, TRIMESTER, BIMESTER, ANNUAL]
        minPassingGrade:
          type: number
          format: decimal
        minGrade:
          type: number
          format: decimal
        maxGrade:
          type: number
          format: decimal
        gradeScalePrecision:
          type: integer
        primaryColor:
          type: string
        requireAttendanceNote:
          type: boolean
        customConfig:
          type: object

    UpdateSchoolSettingsRequest:
      type: object
      properties:
        termType:
          type: string
          enum: [SEMESTER, TRIMESTER, BIMESTER, ANNUAL]
        minPassingGrade:
          type: number
          format: decimal
        minGrade:
          type: number
          format: decimal
        maxGrade:
          type: number
          format: decimal
        gradeScalePrecision:
          type: integer
        primaryColor:
          type: string
        requireAttendanceNote:
          type: boolean

paths:
  # Autenticación
  /auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Autentica un usuario con email y contraseña.
        Rate limit: 5 solicitudes por minuto.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: Cookie de sesión JWT
              schema:
                type: string
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas solicitudes (Rate limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Segundos a esperar antes de reintentar
              schema:
                type: integer

  /auth/logout:
    post:
      summary: Cerrar sesión
      description: Cierra la sesión del usuario y elimina la cookie
      tags:
        - Autenticación
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  redirectUrl:
                    type: string
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Obtener perfil del usuario autenticado
      description: Retorna la información completa del usuario y su sesión actual
      tags:
        - Autenticación
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/UserSession'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/select-school:
    post:
      summary: Seleccionar colegio (para usuarios con múltiples instituciones)
      description: |
        Permite a usuarios con múltiples membresías seleccionar el colegio activo.
        Actualiza la sesión con el contexto del colegio seleccionado.
      tags:
        - Autenticación
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSchoolRequest'
      responses:
        '200':
          description: Colegio seleccionado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectSchoolResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin acceso al colegio seleccionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Sistema (Solo System Admin)
  /system/schools:
    get:
      summary: Listar todos los colegios (System Admin)
      description: Retorna el listado completo de colegios del sistema
      tags:
        - Sistema
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Listado de colegios
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  schools:
                    type: array
                    items:
                      $ref: '#/components/schemas/School'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado (requiere SYSTEM_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Crear nuevo colegio (System Admin)
      description: |
        Crea un nuevo colegio con su configuración inicial, roles predefinidos
        y usuario administrador. Requiere permiso system:schools:manage.
      tags:
        - Sistema
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchoolRequest'
      responses:
        '201':
          description: Colegio creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSchoolResponse'
        '400':
          description: Datos inválidos o slug en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos (requiere system:schools:manage)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Configuración de Colegio
  /schools/{schoolId}/settings:
    patch:
      summary: Actualizar configuración del colegio
      description: |
        Actualiza la configuración de un colegio específico.
        Requiere permiso school:settings:update.
      tags:
        - Colegios
      security:
        - cookieAuth: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
          description: ID del colegio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchoolSettingsRequest'
      responses:
        '200':
          description: Configuración actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  settings:
                    $ref: '#/components/schemas/SchoolSettings'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o sin acceso al colegio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Colegio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Rutas dinámicas por colegio
  /{schoolSlug}/courses:
    get:
      summary: Listar cursos de un colegio
      description: |
        Retorna los cursos de un colegio específico.
        Requiere permiso academic:courses:manage.
      tags:
        - Académico
      security:
        - cookieAuth: []
      parameters:
        - name: schoolSlug
          in: path
          required: true
          schema:
            type: string
          description: Slug del colegio
        - name: year
          in: query
          schema:
            type: integer
          description: Año académico (default: año actual)
        - name: educationLevelId
          in: query
          schema:
            type: string
          description: Filtrar por nivel educativo
      responses:
        '200':
          description: Listado de cursos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
        '400':
          description: Slug de colegio requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin acceso al colegio o sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Colegio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Crear nuevo curso
      description: |
        Crea un nuevo curso en el colegio.
        Requiere permiso academic:courses:manage.
      tags:
        - Académico
      security:
        - cookieAuth: []
      parameters:
        - name: schoolSlug
          in: path
          required: true
          schema:
            type: string
          description: Slug del colegio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  course:
                    $ref: '#/components/schemas/Course'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin acceso al colegio o sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Colegio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /{schoolSlug}/grades:
    get:
      summary: Listar calificaciones
      description: |
        Retorna las calificaciones del colegio.
        Requiere permiso grades:view.
      tags:
        - Calificaciones
      security:
        - cookieAuth: []
      parameters:
        - name: schoolSlug
          in: path
          required: true
          schema:
            type: string
          description: Slug del colegio
        - name: courseId
          in: query
          schema:
            type: string
          description: Filtrar por curso
        - name: studentProfileId
          in: query
          schema:
            type: string
          description: Filtrar por estudiante
      responses:
        '200':
          description: Listado de calificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  grades:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grade'
        '400':
          description: Slug de colegio requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin acceso al colegio o sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Colegio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Ingresar calificación
      description: |
        Crea una nueva calificación.
        Requiere permiso grades:enter.
      tags:
        - Calificaciones
      security:
        - cookieAuth: []
      parameters:
        - name: schoolSlug
          in: path
          required: true
          schema:
            type: string
          description: Slug del colegio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGradeRequest'
      responses:
        '201':
          description: Calificación creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  grade:
                    $ref: '#/components/schemas/Grade'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin acceso al colegio o sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Colegio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

tags:
  - name: Autenticación
    description: Endpoints para autenticación y gestión de sesiones
  - name: Sistema
    description: Endpoints de administración del sistema (System Admin)
  - name: Colegios
    description: Gestión de colegios y configuración institucional
  - name: Académico
    description: Gestión académica (cursos, asignaturas, etc.)
  - name: Calificaciones
    description: Gestión de calificaciones y evaluaciones